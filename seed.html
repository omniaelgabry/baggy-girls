        async function seed() {
            try {
                const statusEl = document.getElementById('status');
                
                // Step 1: Force delete all old products (even duplicated random IDs)
                statusEl.innerText = 'Cleaning up old duplicated products... Please wait.';
                const snapshot = await getDocs(collection(db, "products"));
                for (const docSnap of snapshot.docs) {
                    await deleteDoc(doc(db, "products", docSnap.id));
                }
                
                statusEl.innerText = 'Syncing new products...';
                
                // Step 2: Use deterministic ID for each product to completely prevent future duplicates
                for (let i = 0; i < initialProducts.length; i++) {
                    const prod = initialProducts[i];
                    const docId = `product_${String(i + 1).padStart(2, '0')}`;
                    
                    await setDoc(doc(db, "products", docId), {
                        name: prod.name,
                        price: prod.price,
                        description: prod.description,
                        images: prod.images,
                        createdAt: new Date().toISOString()
                    });
                    statusEl.innerText = `Synced ${i + 1}/${initialProducts.length}`;
                }
                
                statusEl.innerText = 'Seeding complete! You can close this page. (Duplicates permanently resolved)';
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = 'Error: ' + err.message;
            }
        }
        
        seed();
    </script>
