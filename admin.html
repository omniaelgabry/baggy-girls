<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baggy Girls | لوحة التحكم</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            500: '#D4AF37',
                            600: '#C5A017'
                        },
                        dark: {
                            900: '#111111',
                            800: '#1A1A1A',
                            700: '#2A2A2A'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="w-full bg-white shadow-sm py-4 px-6 md:px-12 flex justify-between items-center z-50">
        <a href="index.html" class="text-2xl font-display font-bold tracking-widest text-gold-500">BAGGY <span class="text-sm text-gray-400 font-sans tracking-normal">Admin Panel</span></a>
        <a href="index.html" class="text-gray-600 hover:text-gold-500 transition-colors font-medium">العودة للمتجر <i class="fa-solid fa-arrow-left mr-2"></i></a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-10 max-w-6xl">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Add Product Form -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-bold mb-6 font-display border-b pb-4">إضافة منتج جديد</h2>
                    
                    <form id="add-product-form" class="space-y-5">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">اسم المنتج</label>
                            <input type="text" id="product-name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none transition-all" placeholder="مثال: حقيبة كروس إيليجانس">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">السعر (بالجنيه)</label>
                            <input type="number" id="product-price" required min="0" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none transition-all" placeholder="مثال: 1500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">صور المنتج (متعددة)</label>
                            <div class="relative border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:bg-gray-50 transition-colors cursor-pointer" id="drop-zone">
                                <input type="file" id="product-images" multiple accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-500">اضغط هنا لاختيار الصور</p>
                                <p class="text-xs text-gray-400 mt-1" id="file-count-msg">لم يتم اختيار صور</p>
                            </div>
                            <!-- Image Previews -->
                            <div id="image-previews" class="flex gap-2 mt-4 overflow-x-auto pb-2"></div>
                        </div>
                        
                        <button type="submit" id="submit-btn" class="w-full bg-dark-900 text-white py-4 rounded-xl font-bold hover:bg-gold-500 transition-colors flex justify-center items-center gap-2">
                            <span>إضافة للمتجر</span>
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Products List -->
            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 min-h-[500px] flex flex-col">
                    <div class="flex justify-between items-center border-b pb-4 mb-6">
                        <h2 class="text-2xl font-bold font-display">المنتجات الحالية</h2>
                        <button id="refresh-btn" class="text-gray-500 hover:text-gold-500 transition-colors"><i class="fa-solid fa-rotate-right"></i> تحديث</button>
                    </div>
                    
                    <div id="products-table-container" class="flex-grow relative">
                        <!-- Loading Overlay -->
                        <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center backdrop-blur-sm">
                            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-gold-500 mb-4"></i>
                            <p class="text-gray-600 font-medium">جاري التحميل...</p>
                        </div>
                        
                        <!-- Table -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-right border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 text-gray-500 text-sm">
                                        <th class="p-4 font-medium rounded-r-xl">المنتج</th>
                                        <th class="p-4 font-medium">السعر</th>
                                        <th class="p-4 font-medium text-center rounded-l-xl">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="products-tbody" class="divide-y divide-gray-100">
                                    <!-- Rows injected via JS -->
                                </tbody>
                            </table>
                        </div>
                        
                        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-gray-400">
                            <i class="fa-solid fa-box-open text-6xl mb-4 text-gray-200"></i>
                            <p>لا توجد منتجات مضافة حتى الآن.</p>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="admin.js"></script>
</body>
</html>
