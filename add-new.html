        async function seedNewProducts() {
            const statusEl = document.getElementById('status');
            const progressEl = document.getElementById('progress-bar');
            const textEl = document.getElementById('progress-text');

            try {
                const total = newProducts.length;
                let count = 0;

                for (const product of newProducts) {
                    product.createdAt = new Date().toISOString();
                    await addDoc(collection(db, "products"), product);
                    count++;
                    progressEl.style.width = `${(count / total) * 100}%`;
                    textEl.innerText = `${count} / ${total} منتجات`;
                }

                statusEl.innerText = "تمت إضافة جميع المنتجات بنجاح! 🎉";
                statusEl.classList.replace('text-blue-600', 'text-green-600');
                
                setTimeout(() => {
                    alert("اكتملت الإضافة! يمكنك الآن العودة للمتجر.");
                }, 500);

            } catch (error) {
                console.error("Error:", error);
                statusEl.innerText = "حدث خطأ أثناء الإضافة: " + error.message;
                statusEl.classList.replace('text-blue-600', 'text-red-600');
            }
        }

        // Start automatically
        seedNewProducts();
